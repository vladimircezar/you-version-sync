name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit the bundle for secrets and unexpected hosts
        run: |
          ! grep -qE 'eyJ[A-Za-z0-9_-]{20,}' main.js
          grep -oE 'https://[a-z0-9.-]+\.[a-z]{2,}' main.js | sort -u
